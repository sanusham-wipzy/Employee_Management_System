{% extends 'base.html' %}

{% block content %}

<section class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">

    <div class="card shadow p-4 add-form w-100">

        <h3 class="text-center mb-4">
            Login
        </h3>

        <form action="" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter Username"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required
                >
            </div>


            <div class="d-flex justify-content-between gap-2 mt-5">
                <button type="submit" class="btn btn-primary flex-grow-1">
                    Login
                </button>

                <a href="{% url 'employee_list' %}"
                   class="btn btn-secondary flex-grow-1">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</section>

{% endblock %}
